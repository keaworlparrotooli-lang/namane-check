<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>나만의 체크</title>
<style>
:root{--yellow:#ffe778;--yellow2:#fff6bf;--ink:#202018;--green:#24834b;--red:#e74343;--paper:#fffdf1;--line:#292820}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:2px solid var(--line);background:#fffdf5;color:inherit;padding:10px 12px;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #4b8df8;outline-offset:2px}.app{max-width:760px;margin:auto;padding:12px}.top{display:grid;grid-template-columns:1fr 66px 66px 66px;border:2px solid var(--line);margin-bottom:18px;background:#fff}.brand{display:flex;align-items:center;gap:10px;padding:12px;background:var(--yellow);font-size:clamp(20px,5vw,30px);font-weight:900;cursor:pointer}.nav{font-size:25px;border:0;border-left:2px solid var(--line);padding:8px 2px;background:#fff}.nav.active{background:var(--yellow)}h1{font-size:28px;margin:12px 0 6px}h2{font-size:20px;margin:18px 0 10px}.muted{color:#777}.summary{border:2px solid var(--line);margin:12px 0 18px;background:white}.summary table{border-collapse:collapse;width:100%;table-layout:fixed;text-align:center}.summary th{background:var(--yellow);padding:10px 3px;border:1px solid #777}.summary td{padding:14px 2px;border:1px solid #aaa;font-size:22px;font-weight:800}.progressrow{padding:12px;display:flex;gap:12px;align-items:center}.bar{height:25px;border:2px solid #777;flex:1;background:#fffde7}.bar span{display:block;height:100%;background:#ffdc45;width:0%}.goal-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.goal-tab{min-height:86px;font-size:16px;background:white;overflow-wrap:anywhere}.goal-tab .emo{font-size:26px;display:block;margin-bottom:5px}.goal-tab.selected{background:var(--yellow);box-shadow:inset 0 0 0 2px #f2c91f}.goal-card{border:2px solid var(--line);background:white;margin:12px 0 20px}.goal-head{display:grid;grid-template-columns:76px 1fr 58px 58px;border-bottom:2px solid var(--line)}.goal-emoji{background:var(--yellow);display:grid;place-items:center;font-size:35px;border-right:2px solid var(--line);grid-row:span 2}.goal-label{background:var(--yellow);text-align:center;padding:9px;font-weight:800;border-bottom:1px solid #777}.goal-name{padding:12px 6px;font-size:23px;font-weight:850;text-align:center;overflow-wrap:anywhere}.savebtn{color:var(--green);font-size:28px;background:white;border:0;border-left:1px solid #aaa}.delbtn{color:var(--red);font-size:28px;background:white;border:0;border-left:1px solid #aaa}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.day{min-height:92px;border:0;border-right:1px solid #aaa;border-bottom:1px solid #aaa;position:relative;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:var(--green);padding:4px}.day:nth-child(5n){border-right:0}.day .num{position:absolute;top:0;left:0;background:#fff0a4;color:#555;font-size:13px;padding:3px 7px;font-weight:500}.day.x{color:var(--red)}.day.locked{background:#f5f3e8;color:#aaa}.day:disabled{cursor:default}.meta{padding:10px;text-align:center;color:#777;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px}.actions button{flex:1;min-width:115px;background:var(--yellow2)}.panel{border:2px solid var(--line);padding:14px;background:#fff;margin:12px 0}.field{display:block;margin:12px 0;font-weight:750}.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #888;background:#fff}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.bigbtn{width:100%;background:var(--yellow);margin-top:10px}.listitem{border:1px solid #aaa;padding:12px;margin:8px 0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.hidden{display:none!important}.notice{background:#fff6bf;border:1px solid #d5b52e;padding:12px;margin:12px 0}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:5}.modal{max-width:430px;width:100%;background:var(--paper);border:3px solid var(--line);padding:20px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.emoji-grid button{font-size:25px;padding:8px;border:1px solid #aaa}.cheer{text-align:center;background:linear-gradient(#fff4a6,#ffe15b);padding:20px;border:2px solid var(--line)}.bear{font-size:100px;display:block;animation:wave .7s ease-in-out infinite alternate;transform-origin:70% 80%}@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(9deg)}}.cheerword{font-size:42px;font-weight:1000;color:#174622;text-shadow:2px 2px #fff}.empty{text-align:center;padding:35px 10px;color:#777}@media(max-width:430px){.top{grid-template-columns:1fr 50px 50px 50px}.nav{font-size:21px}.app{padding:9px}.day{min-height:74px}.goal-head{grid-template-columns:60px 1fr 46px 46px}.goal-emoji{font-size:28px}.goal-name{font-size:19px}.goal-tab{font-size:14px;min-height:76px}.summary td{font-size:19px}.row{display:block}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand" onclick="go('home')">🌱 나만의 체크</div><button class="nav" id="nav-archive" aria-label="보관함" onclick="go('archive')">🏆</button><button class="nav" id="nav-letter" aria-label="편지함" onclick="go('letter')">📮</button><button class="nav" id="nav-settings" aria-label="설정" onclick="go('settings')">⚙️</button></header>
<section id="screen"></section>
</main><div id="overlay"></div>
<script>
const $=s=>document.querySelector(s);
const EMOJIS=['🌱','🏃','📚','💧','🥗','🧘','🏌️','☀️','⭐','🐻','🎨','💻','🧹','🛏️','🎯','🎵','🪴','🍎','🚶','✍️','🧠','💪','🧸','🌼','📖','🫧','🦋','🐱','🐰','🍀','❤️','🔥'];
let data={goals:[],archive:[],donations:[]},page='home',selected=null,formEmoji='🌱',onboarded=false;
try{data=JSON.parse(localStorage.getItem('namanecheck_data'))||data;onboarded=localStorage.getItem('namanecheck_intro')==='yes'}catch(e){}
function persist(){localStorage.setItem('namanecheck_data',JSON.stringify(data))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dateStr(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function plusDate(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dateStr(d)}
function daysDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function endDate(g){return plusDate(g.start,g.duration-1)}
function status(g,i){let day=plusDate(g.start,i),today=dateStr(),v=g.checks?.[day];if(v)return v;if(day<today)return 'X';return ''}
function checkedCount(g){let n=0;for(let i=0;i<g.duration;i++)if(status(g,i)==='V')n++;return n}
function pct(g){return Math.round(checkedCount(g)/g.duration*100)}
function current(){return data.goals.find(g=>g.id===selected)||data.goals[0]||null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));let el=$('#nav-'+p);if(el)el.classList.add('active');render()}
function render(){let root=$('#screen');if(page==='home')home(root);else if(page==='archive')archive(root);else if(page==='letter')letter(root);else settings(root)}
function summary(g){let c=checkedCount(g),p=pct(g);return `<div class="summary"><table><tr><th>시작일</th><th>목표 기간</th><th>목표 달성률</th></tr><tr><td>${g.start.slice(5).replace('-','/')}</td><td>${g.duration}일</td><td>${p}%</td></tr></table><div class="progressrow"><div class="bar"><span style="width:${p}%"></span></div><b>${c}일 / ${g.duration}일</b></div></div>`}
function home(root){let g=current();root.innerHTML=`<h1>오늘도 나만의 목표를 체크해요.</h1>${g?summary(g):'<div class="notice">목표 추가를 눌러 첫 목표를 만들어 보세요!</div>'}<div class="goal-tabs">${data.goals.map(x=>`<button class="goal-tab ${g&&g.id===x.id?'selected':''}" onclick="selectGoal('${x.id}')"><span class="emo">${esc(x.emoji)}</span>${esc(x.name||'새 목표')}</button>`).join('')}<button class="goal-tab" onclick="newGoal()"><span class="emo">＋</span>목표 추가</button></div>${g?goalCard(g):''}`}
function goalCard(g){let today=dateStr(),started=g.start<=today;let cells='';for(let i=0;i<g.duration;i++){let d=plusDate(g.start,i),v=status(g,i),isToday=d===today,locked=d>today||d<today;cells+=`<button class="day ${v==='X'?'x':''} ${d>today?'locked':''}" ${d>today?'disabled':''} onclick="tapDay('${g.id}','${d}')" aria-label="${i+1}일 ${v||'빈칸'}"><span class="num">${i+1}</span>${v==='V'?'✓':v==='X'?'×':''}</button>`}
return `<div class="goal-card"><div class="goal-head"><button class="goal-emoji" onclick="emojiPicker('${g.id}')" title="이모티콘 선택">${esc(g.emoji)}</button><div class="goal-label">목표명</div><button class="savebtn" title="목표 저장" onclick="saveGoal('${g.id}')">✓</button><button class="delbtn" title="목표 삭제" onclick="deleteGoal('${g.id}')">×</button><div class="goal-name" style="grid-column:2">${esc(g.name)}</div></div><div class="days">${cells}</div><div class="meta">시작일 ${g.start} · 목표 기간 ${g.duration}일 · ✓ 초록색 / × 빨간색<br>오늘 칸을 누를 때마다 빈칸 → V → X → 빈칸으로 바뀝니다.</div><div class="actions"><button onclick="editGoal('${g.id}')">목표 수정</button><button onclick="extendGoal('${g.id}')">기간 연장</button><button onclick="archiveGoal('${g.id}')">보관함</button></div>${!started?'<div class="notice">시작 예정일: '+g.start+'</div>':''}</div>`}
function selectGoal(x){selected=x;render()}
function newGoal(){formEmoji='🌱';modal(`<h2>🌱 목표 추가</h2><label class="field">이모티콘<button type="button" onclick="emojiPicker(null)" class="bigbtn" id="form-emoji">${formEmoji} 선택하기</button></label><label class="field">목표명<input id="gname" maxlength="80" placeholder="예: 매일 운동하기"></label><label class="field">시작일<input id="gstart" type="date" min="${dateStr()}" value="${dateStr()}"></label><label class="field">목표 기간 (일)<input id="gdur" type="number" min="1" max="1000" value="10"></label><p class="muted small">기간을 입력하면 체크 칸이 자동으로 만들어져요.</p><button class="bigbtn" onclick="createGoal()">✓ 등록</button><button class="bigbtn" onclick="closeModal()">취소</button>`)}
function createGoal(){let name=$('#gname').value.trim(),start=$('#gstart').value,duration=Number($('#gdur').value);if(!name||!start||!duration||duration<1||!Number.isInteger(duration)){alert('목표명, 시작일, 목표 기간을 모두 입력해 주세요.');return}if(start<dateStr()){alert('시작일은 오늘 또는 미래 날짜로 선택해 주세요.');return}let g={id:id(),name,start,duration,emoji:formEmoji,checks:{},created:dateStr()};data.goals.push(g);selected=g.id;persist();closeModal();go('home')}
function saveGoal(gid){let g=data.goals.find(x=>x.id===gid);if(!g)return;alert('목표가 저장되어 있어요!')}
function deleteGoal(gid){let g=data.goals.find(x=>x.id===gid);if(!g)return;if(confirm(`“${g.name}” 목표와 체크 기록을 삭제할까요? 보관하려면 취소 후 보관함을 선택하세요.`)){data.goals=data.goals.filter(x=>x.id!==gid);if(selected===gid)selected=data.goals[0]?.id||null;persist();render()}}
function tapDay(gid,day){let g=data.goals.find(x=>x.id===gid);if(!g)return;let today=dateStr();if(day>today){alert('미래 날짜는 미리 체크할 수 없어요.');return}if(day<today){pastEdit(g,day);return}let v=g.checks[day]||'';g.checks[day]=v===''?'V':v==='V'?'X':'';if(!g.checks[day])delete g.checks[day];persist();render();if(day===endDate(g)&&daysDiff(g.start,today)>=g.duration-1)maybeFinish(g)}
function pastEdit(g,day){let edits=Number(localStorage.getItem('namane_edits_'+new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'))||0);if(daysDiff(day,dateStr())>2){alert('지난 기록은 최대 2일 전까지만 수정할 수 있어요.');return}if(edits>=2){alert('이번 달의 과거 기록 수정 기회 2회를 모두 사용했어요.');return}modal(`<h2>과거 기록 수정</h2><p>${day} 기록을 수정할까요?</p><label><input type="checkbox" id="pledge"> 실제로 실천한 내용을 정직하게 기록하겠습니다.</label><button class="bigbtn" onclick="confirmPast('${g.id}','${day}')">동의하고 수정하기</button><button class="bigbtn" onclick="closeModal()">취소</button>`)}
function confirmPast(gid,day){if(!$('#pledge').checked){alert('동의 항목을 체크해 주세요.');return}let g=data.goals.find(x=>x.id===gid);let v=g.checks[day]||'';g.checks[day]=v===''?'V':v==='V'?'X':'';if(!g.checks[day])delete g.checks[day];let key='namane_edits_'+new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');localStorage.setItem(key,String(Number(localStorage.getItem(key)||0)+1));persist();closeModal();render()}
function editGoal(gid){let g=data.goals.find(x=>x.id===gid);modal(`<h2>목표 수정</h2><label class="field">목표명<input id="ename" value="${esc(g.name)}"></label><label class="field">시작일<input id="estart" type="date" min="${dateStr()}" value="${g.start}"></label><label class="field">목표 기간<input id="edur" type="number" min="1" max="1000" value="${g.duration}"></label><button class="bigbtn" onclick="applyEdit('${gid}')">저장</button><button class="bigbtn" onclick="closeModal()">취소</button>`)}
function applyEdit(gid){let g=data.goals.find(x=>x.id===gid),name=$('#ename').value.trim(),start=$('#estart').value,d=Number($('#edur').value);if(!name||!start||!Number.isInteger(d)||d<1){alert('모든 항목을 올바르게 입력해 주세요.');return}if(start<dateStr()){alert('시작일은 오늘 또는 미래 날짜로 설정해 주세요.');return}g.name=name;g.start=start;g.duration=d;persist();closeModal();render()}
function extendGoal(gid){let g=data.goals.find(x=>x.id===gid),p=pct(g),need=Math.max(1,Math.ceil(checkedCount(g)/.9)-g.duration);modal(`<h2>목표 기간 연장</h2><p>현재 달성률: <b>${p}%</b></p><p>90% 달성까지 필요한 최소 추가 기간(계산상): <b>${need}일</b></p><label class="field">추가할 날짜<input id="extra" type="number" min="1" value="${need}"></label><button class="bigbtn" onclick="applyExtend('${gid}')">기간 늘리기</button><button class="bigbtn" onclick="closeModal()">취소</button>`)}
function applyExtend(gid){let g=data.goals.find(x=>x.id===gid),n=Number($('#extra').value);if(!Number.isInteger(n)||n<1){alert('1일 이상 입력해 주세요.');return}g.duration+=n;persist();closeModal();render()}
function maybeFinish(g){if(g.finishedNotified)return;g.finishedNotified=true;persist();if(pct(g)>=90)modal(`<div class="cheer"><div class="cheerword">목표 달성 축하해요!</div><span class="bear">🐻👋</span><p>정말 잘했어요!</p></div><button class="bigbtn" onclick="closeModal();archiveGoal('${g.id}')">보관함으로</button><button class="bigbtn" onclick="closeModal();extendGoal('${g.id}')">계속 도전하기</button>`)}
function archiveGoal(gid){let g=data.goals.find(x=>x.id===gid);if(!g)return;if(!confirm('목표와 체크 기록을 보관함으로 옮길까요?'))return;data.archive.push({...g,archivedAt:dateStr(),finalPercent:pct(g)});data.goals=data.goals.filter(x=>x.id!==gid);selected=data.goals[0]?.id||null;persist();go('archive')}
let savedGoalModal='';
function emojiPicker(gid){
  if(!gid){savedGoalModal=$('#overlay').innerHTML;}
  let buttons=EMOJIS.map(e=>`<button onclick="chooseEmoji('${e}','${gid||''}')">${e}</button>`).join('');
  modal(`<h2>이모티콘 선택</h2><p class="muted small">원하는 이모티콘을 하나 선택하세요. 선택하면 목표 입력 화면으로 돌아가요.</p><div class="emoji-grid">${buttons}</div><button class="bigbtn" onclick="returnToGoalForm()">입력 화면으로 돌아가기</button>`);
}
function returnToGoalForm(){if(savedGoalModal){$('#overlay').innerHTML=savedGoalModal;savedGoalModal='';}else closeModal();}
function chooseEmoji(e,gid){
  formEmoji=e;
  if(gid){let g=data.goals.find(x=>x.id===gid);if(g)g.emoji=e;persist();closeModal();render();}
  else{
    if(savedGoalModal){$('#overlay').innerHTML=savedGoalModal;savedGoalModal='';}
    let btn=$('#form-emoji');if(btn)btn.textContent=e+' 선택하기';
    if($('#gname'))$('#gname').focus();
  }
}
function archive(root){root.innerHTML=`<h1>🏆 보관함</h1><p class="muted">종료한 목표와 체크 기록을 다시 볼 수 있어요.</p>${data.archive.length?data.archive.map(g=>`<div class="panel"><h2>${esc(g.emoji)} ${esc(g.name)}</h2><p>시작일 ${g.start} · ${g.duration}일 · 달성률 ${g.finalPercent??pct(g)}%</p><div class="days">${Array.from({length:g.duration},(_,i)=>{let d=plusDate(g.start,i),v=g.checks?.[d]|| (d<dateStr()?'X':'');return `<div class="day ${v==='X'?'x':''}"><span class="num">${i+1}</span>${v==='V'?'✓':v==='X'?'×':''}</div>`}).join('')}</div><button class="bigbtn" onclick="restartArchived('${g.id}')">이 목표로 다시 시작</button></div>`).join(''):'<div class="empty">아직 보관한 목표가 없어요.</div>'}`}
function restartArchived(gid){let g=data.archive.find(x=>x.id===gid);if(!g)return;formEmoji=g.emoji;modal(`<h2>다시 도전하기</h2><label class="field">목표명<input id="rname" value="${esc(g.name)}"></label><label class="field">시작일<input id="rstart" type="date" min="${dateStr()}" value="${dateStr()}"></label><label class="field">목표 기간(일)<input id="rdur" type="number" min="1" value="${g.duration}"></label><button class="bigbtn" onclick="restartNow('${gid}')">새 기록으로 시작</button>`)}
function restartNow(gid){let old=data.archive.find(x=>x.id===gid),name=$('#rname').value.trim(),start=$('#rstart').value,d=Number($('#rdur').value);if(!name||!start||start<dateStr()||!Number.isInteger(d)||d<1){alert('입력 내용을 확인해 주세요.');return}let g={id:id(),name,start,duration:d,emoji:old.emoji,checks:{},created:dateStr()};data.goals.push(g);selected=g.id;persist();closeModal();go('home')}
function letter(root){root.innerHTML=`<h1>📮 편지함</h1><p class="muted">목표 달성 인증과 소감을 보내는 방법을 확인하세요.</p><div class="panel"><h2>🎁 목표 달성 보상 신청</h2><p>달성률 90% 이상인 목표는 인증 자료와 소감을 보내 보상 신청을 할 수 있어요.</p><ul><li>달성 퍼센트와 체크 칸이 보이는 사진</li><li>목표명이 개인정보라면 목표명만 가린 사진</li><li>간단한 소감 두 가지</li></ul><p class="small muted">이 앱은 이메일을 자동으로 보내지 않습니다. 아래 버튼은 이메일 앱을 열어 초안을 준비합니다.</p><button class="bigbtn" onclick="sendProof()">📮 이메일로 보상 신청</button></div><div class="panel"><h2>💌 간단한 소감</h2><label class="field">소감 1<textarea id="thought1" rows="2" placeholder="목표를 하며 느낀 점"></textarea></label><label class="field">소감 2<textarea id="thought2" rows="2" placeholder="다음 목표에 대한 다짐"></textarea></label><p class="muted small">이메일 주소는 설정한 적이 없어 자동으로 지정하지 않았어요.</p></div>`}
function sendProof(){let g=current(),p=g?pct(g):0;if(!g){alert('먼저 목표를 만들어 주세요.');return}let a=$('#thought1')?.value||'',b=$('#thought2')?.value||'';let body=`나만의 체크 목표 달성 보상 신청\\n목표명: ${g.name}\\n달성률: ${p}%\\n체크 기록: ${checkedCount(g)}일 / ${g.duration}일\\n\\n소감 1: ${a}\\n소감 2: ${b}\\n\\n인증 사진을 첨부합니다.`;location.href='mailto:?subject='+encodeURIComponent('나만의 체크 목표 달성 보상 신청')+'&body='+encodeURIComponent(body)}
function settings(root){root.innerHTML=`<h1>⚙️ 설정</h1><p class="muted">데이터를 백업하고 복구할 수 있어요.</p><h2>연동하기</h2><button class="bigbtn" onclick="backupVia('📮 지메일')">📮 지메일로 백업 / 복원 안내</button><button class="bigbtn" onclick="backupVia('🐻 카카오톡')">🐻 카카오톡으로 백업 / 복원 안내</button><p class="muted small">자동 동기화가 아니라 백업 파일을 직접 저장하거나 공유하는 방식이에요.</p><h2>데이터 관리</h2><button class="bigbtn" onclick="downloadBackup()">📦 데이터 백업 파일 만들기</button><label class="field">백업 파일 복구<input type="file" accept=".json,application/json" onchange="restoreBackup(event)"></label><button class="bigbtn" onclick="donate()">📮 작은 기부 감사합니다 · 자유 금액 기부</button><button class="bigbtn" onclick="clearAll()">🗑️ 모든 데이터 삭제</button><p class="muted small">기부는 선택 사항이며, 이 앱은 결제를 직접 처리하지 않습니다.</p>`}
function backupVia(which){modal(`<h2>${which}</h2><p>먼저 백업 파일을 만들고, ${which}에서 직접 공유하거나 저장해 주세요. 자동 로그인이나 자동 동기화는 지원하지 않습니다.</p><button class="bigbtn" onclick="closeModal();downloadBackup()">백업 파일 만들기</button><button class="bigbtn" onclick="closeModal()">닫기</button>`)}
function downloadBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='나만의체크_백업_'+dateStr()+'.json';a.click();URL.revokeObjectURL(url)}
function restoreBackup(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.goals)||!Array.isArray(d.archive))throw Error();if(confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')){data=d;persist();selected=null;alert('복구했어요.');go('home')}}catch(e){alert('올바른 나만의 체크 백업 파일이 아니에요.')}};r.readAsText(f)}
function donate(){modal(`<h2>📮 작은 기부 감사합니다</h2><p>앱을 응원하고 싶다면 자유로운 금액으로 기부할 수 있어요.</p><label class="field">기부 금액 (원)<input id="donateamt" type="number" min="1" placeholder="원하는 금액"></label><p class="muted small">결제 계정이나 결제 링크가 아직 설정되지 않아 여기서 실제 결제를 진행할 수는 없어요.</p><button class="bigbtn" onclick="saveDonationIntent()">기부 의사 저장</button><button class="bigbtn" onclick="closeModal()">닫기</button>`)}
function saveDonationIntent(){let n=Number($('#donateamt').value);if(!Number.isFinite(n)||n<1){alert('금액을 입력해 주세요.');return}data.donations.push({amount:n,date:dateStr()});persist();closeModal();alert('기부 의사를 이 기기에 저장했어요. 실제 결제는 진행되지 않았습니다.')}
function clearAll(){if(confirm('모든 목표와 기록을 영구 삭제할까요? 이 작업은 되돌릴 수 없어요.')&&confirm('정말 삭제할까요? 먼저 백업하는 것을 권장해요.')){data={goals:[],archive:[],donations:[]};selected=null;persist();go('home')}}
function modal(s){$('#overlay').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}
function closeModal(){$('#overlay').innerHTML=''}
function showIntro(){modal(`<div class="cheer"><h2>나만의 체크에 오신 걸 환영해요!</h2><p>목표를 정하고, 매일 체크하고, 기록을 모아 보세요.</p><p>오늘 못 해도 괜찮아요. 내일 다시 시작하면 돼요!</p><p class="small">체크는 빈칸 → V → X → 빈칸 순서예요. 오늘만 바로 수정할 수 있고, 과거 기록은 제한된 수정 기회가 있어요.</p><label><input id="agree" type="checkbox"> 안내를 읽었고 동의합니다.</label><button class="bigbtn" onclick="agreeStart()">동의 · 시작하기</button></div>`)}
function agreeStart(){if(!$('#agree').checked){alert('안내를 읽고 동의 항목을 체크해 주세요.');return}localStorage.setItem('namanecheck_intro','yes');closeModal();modal(`<div class="cheer"><div class="cheerword">화이팅!!</div><span class="bear">🐻👋</span><p>오늘도 한 걸음씩!</p></div>`);setTimeout(()=>{if($('#overlay').innerHTML.includes('화이팅!!')){closeModal();go('home')}},2200)}
if(!onboarded)showIntro();render();
</script></body></html>
